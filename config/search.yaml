# 하이퍼파라미터 탐색 범위. 이 파일이 그대로 논문 표가 된다 (research-plan.md 4.2 ④).
#
# 값을 적는 방법 세 가지:
#   [a, b, c]            셋 중 하나를 고른다
#   {uniform: [a, b]}    a와 b 사이에서 고르게 뽑는다
#   {log: [a, b]}        a와 b 사이를 로그 눈금으로 뽑는다 (0.001과 0.01의 간격을
#                        0.1과 1의 간격과 같게 본다. 학습률·규제처럼 자릿수가 중요한 값)

seed: 42

# 모델당 시행 횟수. 다 못 돌아도 돌아간 만큼으로 고를 수 있고, 몇 번 돌았는지를
# 결과 파일이 기록한다. 논문에는 실제로 돈 횟수를 적는다.
trials: 30

# 고르는 기준. 불균형 데이터라 PR-AUC를 본다. 임계값과 무관한 지표여야 τ를 정하기 전에
# 설정을 고를 수 있다 (research-plan.md 6.1).
metric: pr_auc

xgboost:
  # 나무 수는 탐색하지 않는다. 조기 종료가 정한다.
  max_depth: [4, 6, 8, 10, 12]
  min_child_weight: [1, 2, 4, 8, 16]
  subsample: {uniform: [0.6, 1.0]}
  colsample_bytree: {uniform: [0.4, 1.0]}
  reg_lambda: {log: [0.1, 20.0]}
  # 아래를 0.01까지 내리면 조기 종료가 2,000그루를 다 쓰면서 한 시행이 수십 분이 된다.
  # 탐색 예산이 거기서 다 나가므로 0.03에서 끊는다.
  learning_rate: {log: [0.03, 0.3]}

random_forest:
  # n_estimators도 탐색하지 않는다. 배깅은 나무를 더 쌓아도 과적합하지 않고 평평해지기만
  # 해서 고를 값이 아니라 예산 문제다. 200으로 고정하고 config/model.yaml에 남겨 둔다.
  #
  # 첫 실행에서 RF가 덜 자란 쪽이었다(학습 0.6242 / 검증 0.5184, 간극 0.1058).
  # 그래서 범위를 용량이 커지는 쪽으로 연다 — 깊이를 끝까지(null) 열고 리프를 작게.
  max_depth: [16, 24, 32, null]
  min_samples_leaf: [5, 10, 20, 50]
  # sqrt는 432개 중 20개만 후보로 본다. 0.1이면 43개, 0.3이면 130개다.
  # card1이 후보에 뽑히는 빈도가 달라져서 첫 실행의 중요도 순위가 바뀔 수 있다.
  max_features: [sqrt, 0.1, 0.3]

mlp:
  # 첫 실행에서 MLP는 외운 쪽이었다(학습 0.8721 / 검증 0.4651, 간극 0.4070).
  # 그래서 범위를 규제가 세지는 쪽으로 연다 — alpha를 0.1까지 올리고, 층을 작게 하고,
  # max_iter를 10까지 내린다. 여기서 max_iter는 성능 손잡이가 아니라 규제 손잡이다.
  hidden_layer_sizes: [[64], [128], [128, 64], [256, 64], [256, 128]]
  alpha: {log: [0.00001, 0.1]}
  learning_rate_init: {log: [0.0001, 0.01]}
  batch_size: [256, 512, 1024]
  max_iter: [10, 20, 40, 60, 100]
