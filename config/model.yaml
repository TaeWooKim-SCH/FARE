# 탐지 모델 설정. 하이퍼파라미터를 코드에 박지 않고 여기서만 바꾼다.
# 실험 결과를 저장할 때 이 파일 내용을 함께 남겨야 나중에 재현된다.

seed: 42

# 학습셋 뒤쪽에서 이만큼을 떼어 조기 종료에 쓴다.
# 검증셋으로 조기 종료를 하면 τ를 정하는 데이터가 이미 모델을 고르는 데 쓰인 셈이 된다.
# 0.15면 학습셋 413,378행 중 약 62,000행이라 검증셋(59,054행)과 비슷한 크기가 된다.
early_stop_ratio: 0.15

xgboost:
  # 나무를 몇 그루까지 쌓을지. 아래 early_stopping이 먼저 멈추면 여기까지 안 간다.
  n_estimators: 2000
  learning_rate: 0.05
  max_depth: 8
  min_child_weight: 4
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0

  # 검증셋 aucpr이 이만큼 안 좋아지면 멈춘다. 불균형 데이터라 logloss 대신 aucpr을 본다.
  early_stopping_rounds: 100
  eval_metric: aucpr

  # 사기가 3.5%뿐이라 양성 가중치를 올리고 싶어지는데, 쓰지 않는다.
  # 가중치로 한 번 밀고 임계값으로 또 미는 것은 같은 조정을 두 번 하는 셈이고,
  # 확률값이 실제 사기율에서 멀어져 τ의 뜻이 흐려진다. 불균형은 τ로만 다룬다.
  scale_pos_weight: 1.0

# 아래 값은 손으로 고른 잠정값이다. 하이퍼파라미터 탐색은 별도 PR에서 하고,
# 그때 탐색 범위와 최종 설정을 논문에 적는다 (research-plan.md 4.2 ④).
random_forest:
  # 배깅은 나무를 더 쌓아도 과적합하지 않고 평평해지기만 한다. 조기 종료가 없으므로
  # 여기서 고정한다. XGBoost처럼 학습셋을 갈라 멈출 시점을 찾을 필요가 없다.
  n_estimators: 200

  # 끝까지 기르면(max_depth 없음) 413,378행에서 리프가 수만 개씩 생겨 나무 하나가
  # 수 MB가 된다. 200그루면 GB 단위라 깊이와 리프 최소 크기를 함께 걸어 잡는다.
  max_depth: 16
  min_samples_leaf: 20

  # 분기마다 432개 중 sqrt(432) ≈ 20개만 후보로 본다. 나무끼리 덜 닮게 만드는 장치라
  # 배깅의 핵심이다. 전부 보면 나무가 다 비슷해져서 평균 내는 뜻이 없어진다.
  max_features: sqrt

  # XGBoost의 scale_pos_weight와 같은 이유로 쓰지 않는다. 가중치로 한 번 밀고
  # 임계값으로 또 미는 것은 같은 조정을 두 번 하는 셈이다. 불균형은 τ로만 다룬다.
  class_weight: null

# MLP 입력 변환. 트리는 이 설정을 안 쓴다 — 공통 전처리 결과를 그대로 먹는다.
mlp:
  # 글자 컬럼 중 값 종류가 이 수 이하면 원핫으로 풀고, 넘으면 빈도 인코딩한다.
  # 전처리 뒤 실측 기준(결측 코드 -2도 한 종으로 센다) 25개가 5종 이하고 그다음이
  # P_emaildomain 60종이라 사이가 넓다. 5부터 59까지 어느 값을 넣어도 같은 25/6으로
  # 갈리고 60에서 처음 26/5로 뒤집힌다. 경계에 안 걸리게 10으로 둔다.
  onehot_max_values: 10

  # 숫자로 들어오지만 크기에 뜻이 없는 컬럼. MLP는 값을 크기로 읽어서 card1=7919와
  # 7920을 이웃으로 본다. 트리는 범위로 잘라 쓸 수 있어 그대로 두지만 MLP는 못 쓴다.
  # 목록은 feature-taxonomy.md의 조작 불가 항목에서 왔다 — 카드와 청구지 식별자다.
  id_columns: [card1, card2, card3, card5, addr1, addr2]

threshold:
  # 사기를 놓치는 쪽이 헛짚는 쪽보다 비싸다는 판단 (research-plan.md 4.3).
  # beta=2면 Recall을 Precision보다 2배로 친다.
  # 세 모델이 같은 beta를 쓰되 τ는 모델마다 따로 정한다 — 숲과 부스팅은 확률이
  # 만들어지는 방식이 달라 같은 τ를 공유하면 안 된다.
  beta: 2.0
